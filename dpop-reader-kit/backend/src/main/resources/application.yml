server:
  port: 8099

spring:
  application:
    name: dpop-lab-backend

# Cœur du lab : DPoP est exigé sur les endpoints d'authentification.
# Passez à false pour observer le comportement "bearer" classique (voir README).
dpop:
  required: true

# Jetons émis : JWT ES256 signés par le serveur, liés à la clé du client par cnf.jkt.
jwt:
  issuer: dpop-lab-backend
  access-ttl-seconds: 300
  refresh-ttl-seconds: 86400

logging:
  level:
    com.example.dpoplab: INFO
