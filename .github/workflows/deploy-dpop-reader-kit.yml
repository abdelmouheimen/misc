name: Deploy dpop-reader-kit to VPS

# Deploys on every merge (push) into main or master, or manually.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

# Never run two deploys at the same time
concurrency:
  group: deploy-dpop-reader-kit
  cancel-in-progress: false

env:
  APP_DIR: /opt/dpop-reader-kit

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source to VPS
        run: |
          rsync -az --delete \
            --rsync-path="mkdir -p ${APP_DIR} && rsync" \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='target' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='docker-compose.vps.yml' \
            --exclude='/Caddyfile' \
            --exclude='frontend/.env.production' \
            ./dpop-reader-kit/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_DIR}/"

      # HTTPS (Web Crypto requires a secure context) on <ip-with-dashes>.sslip.io, a free DNS
      # name resolving to the VPS IP. Caddy terminates TLS (automatic Let's Encrypt certificate)
      # and serves the SPA and the API on a single origin; backend/frontend ports stay private.
      - name: Compute public host
        run: echo "PUBLIC_HOST=$(echo '${{ secrets.VPS_HOST }}' | tr . -).sslip.io" >> "$GITHUB_ENV"

      - name: Configure HTTPS reverse proxy (Caddy, single origin, firewall)
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cat > ${APP_DIR}/frontend/.env.production" <<EOF
          VITE_BACKEND_URL=https://${PUBLIC_HOST}
          EOF
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cat > ${APP_DIR}/Caddyfile" <<EOF
          ${PUBLIC_HOST} {
              encode gzip
              handle /login/* {
                  reverse_proxy backend:8099
              }
              handle /debug/* {
                  reverse_proxy backend:8099
              }
              handle /.well-known/* {
                  reverse_proxy backend:8099
              }
              handle {
                  reverse_proxy frontend:80
              }
          }
          EOF
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "cat > ${APP_DIR}/docker-compose.vps.yml" <<EOF
          services:
            backend:
              ports: !reset []
              environment:
                CORS_ALLOWED_ORIGIN: "https://${PUBLIC_HOST}"
            frontend:
              ports: !reset []
            caddy:
              image: caddy:2-alpine
              restart: unless-stopped
              ports:
                - "80:80"
                - "443:443"
                - "443:443/udp"
              volumes:
                - ./Caddyfile:/etc/caddy/Caddyfile:ro
                - caddy_data:/data
                - caddy_config:/config
              depends_on:
                - backend
                - frontend
          volumes:
            caddy_data: {}
            caddy_config: {}
          EOF
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "if command -v ufw >/dev/null; then ufw allow 80/tcp >/dev/null; ufw allow 443/tcp >/dev/null; ufw allow 443/udp >/dev/null; ufw delete allow 5173/tcp >/dev/null 2>&1; ufw delete allow 8099/tcp >/dev/null 2>&1; true; fi"

      - name: Build & (re)start containers
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${APP_DIR} && docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build --remove-orphans && docker image prune -f"

      # Checked from the GitHub runner, through Caddy, with a valid certificate.
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${PUBLIC_HOST}/debug/tokens" >/dev/null 2>&1 \
               && curl -fsS "https://${PUBLIC_HOST}/" >/dev/null 2>&1; then
              echo "Lab is healthy on https://${PUBLIC_HOST}"; exit 0
            fi
            echo "waiting for lab... ($i/30)"; sleep 5
          done
          echo "Lab did not become healthy in time"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker compose -f ${APP_DIR}/docker-compose.yml -f ${APP_DIR}/docker-compose.vps.yml logs --tail=50"
          exit 1
